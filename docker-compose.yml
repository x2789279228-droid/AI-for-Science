# 一键全栈（SQLite 单机栈 → 收敛为 2 服务，不硬凑重型基建；
# 结构可随业务演进扩展出 pg/qdrant 等服务）。
# 用法：cp ../.env.example .env（填 key）&& docker compose up --build
#   浏览器访问 http://localhost:3000；API 健康 http://localhost:8100/api/health
services:
  api:
    restart: unless-stopped        # 云上 7×24：宿主机重启后自动拉起
    build:
      context: ./api
      args:
        # 构建期 PyPI 源：国内服务器在 .env 设 UV_DEFAULT_INDEX=<镜像站> 加速 uv sync
        UV_DEFAULT_INDEX: ${UV_DEFAULT_INDEX:-https://pypi.org/simple}
    # 固定镜像名：云上 web 镜像走"本地构建→save/load"通道，compose 需按名识别已有镜像
    image: scholar-agent-api
    ports:
      - "${API_HOST_PORT:-8100}:8100"
    environment:
      # 容器内走 PyMuPDF/VLM 兜底通道（MinerU 为宿主机增强，见 api/Dockerfile 注释）
      MINERU_ENABLED: "off"
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-off}
      SEMANTIC_JUDGE: ${SEMANTIC_JUDGE:-1}
      PROMPT_VARIANT: ${PROMPT_VARIANT:-default}
    env_file:
      - path: .env
        required: false          # 离线/无 LLM 演示可不配（抽取式降级闭环仍可跑）
    volumes:
      # 宿主数据目录 = scholar-agent/data（config.ROOT/data，与本地开发同源）
      - ./data:/app/data
      # 外部校准/趋势数据源（/health 的外部金标 gates 与轮次趋势读它）——
      # 镜像内不打包 docs（演示快照保持最小），只读挂载进容器
      - ./docs/acceptance:/app/docs/acceptance:ro
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8100/api/health', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ./web
      args:
        # 构建期注入浏览器侧 API 地址（本机默认 localhost；云上在 .env 覆盖为 http://<公网IP>:8100）
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8100}
    # 云部署：宿主端口经 WEB_HOST_PORT 覆盖（阿里云服务器 3000 已被现有业务占用）
    restart: unless-stopped
    image: scholar-agent-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
