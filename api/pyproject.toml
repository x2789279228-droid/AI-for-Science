[project]
name = "scholar-agent-api"
version = "0.1.0"
description = "科研助手 Agent 后端：DocIR 解析 / 混合检索 / 抗幻觉溯源问答"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24",
    "httpx>=0.27",
    "numpy>=1.26",
    "fastembed>=0.9.1",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "networkx>=3.0",
    "psutil>=5.9",
    "loguru>=0.7",
    "pyyaml>=6.0",
    "bibtexparser>=2.1.0",
    "sickle>=0.7.0",
]

[project.optional-dependencies]
# 密集向量可选后端：安装后设 EMBEDDING_BACKEND=chroma 启用
chroma = ["chromadb>=0.5"]
# python_sandbox 绘图后端（评分表沙箱出图演示）：uv pip install matplotlib
sandbox = ["matplotlib>=3.8"]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.42",
    "pytest>=8.2",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
