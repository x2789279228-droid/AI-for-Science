# Nginx 反代样例（评分表"部署"项）：/ → web:3000，/api → api:8100
# ⚠ 关键：SSE 必须关缓冲（proxy_buffering off + 长读超时），否则流式问答/翻译会被
# Nginx 整段缓冲成"一次性吐出"，演示观感直接劣化——这三个指令是本部署的灵魂。
server {
    listen 80;
    server_name _;

    client_max_body_size 200m;      # PDF 上传上限（>100MB 拒绝在后端）

    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # ---- SSE 三件套（缺失 = 流式失效）----
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header Connection "";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;      # Next.js HMR websocket（开发态）
        proxy_set_header Connection "upgrade";
    }
}
